<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -100 4000 1000" width="100%" height="100%">
  <defs>
    <mask id="gap-mask">
      <rect x="-500" y="-500" width="5000" height="2000" fill="white" />
      <path d="M 350 820 L 650 100 L 950 820" stroke="black" stroke-width="180" stroke-linejoin="round" fill="none" />
    </mask>
    <clipPath id="bottom-clip">
      <rect x="0" y="0" width="1000" height="720" />
    </clipPath>
  </defs>

  <!-- M Logo Symbol -->
  <g clip-path="url(#bottom-clip)">
    <!-- Left Shape -->
    <path d="M 50 820 L 350 100 L 650 820" stroke="#16375A" stroke-width="120" stroke-linejoin="round" fill="none" mask="url(#gap-mask)" />
    <!-- Right Shape -->
    <path d="M 350 820 L 650 100 L 950 820" stroke="#16375A" stroke-width="120" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Text -->
  <text x="1150" y="580" font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="460" fill="#16375A" letter-spacing="30">M PROJECT</text>
</svg>