name: Supabase Keep-Alive (Anti-Pause)

on:
  schedule:
    # Esegue automaticamente ogni 3 giorni alle 05:00 UTC (previene la pausa dei 7 giorni)
    - cron: '0 5 */3 * *'
  workflow_dispatch: # Consente di eseguire il ping manualmente dalla scheda Actions di GitHub
  push:
    paths:
      - '.github/workflows/supabase-keep-alive.yml'
      - 'scripts/keep-alive.js'

jobs:
  keep-alive:
    name: Ping Supabase Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Keep-Alive Ping
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ifbgavdvupgyfvmyesie' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ifbgavdvupgyfvmyesie.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keep-alive.js
